[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "merisescu", email = "merisescupt@cardiff.ac.uk" }
]
requires-python = ">=3.14"
dependencies = [
    "cnsplots>=0.4.0",
    "matplotlib>=3.11.1",
    "nest-simulator>=3.10.0",
    "tonic>=1.6.0",
]

[project.scripts]
workspace = "workspace:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
